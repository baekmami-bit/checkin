<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<title>입장 스캔</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
  /* ============================================================
   * GitHub Pages 등 Apps Script 밖에서 이 파일을 쓸 때만
   * 아래 따옴표 안에 웹앱 주소(…/exec)를 붙여넣으세요.
   * Apps Script 안(…/exec?page=scan)에서 쓸 때는 비워 둬도 됩니다.
   * ============================================================ */
  var API_URL = '';
</script>
<style>
  :root { --ok:#14833b; --dup:#e0a800; --bad:#c62828; --net:#ef6c00; --bg:#0f1420; --panel:#ffffff; --ink:#1d2433; --muted:#6b7280; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { word-break: keep-all; background: var(--bg); color: #fff; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; overflow: hidden; }
  button { font: inherit; border: 0; border-radius: 12px; cursor: pointer; }
  input { font: inherit; }
  .hidden { display: none !important; }

  /* 로그인 */
  #login { position: fixed; inset: 0; background: #eef1f6; color: var(--ink); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #login .card { width: 100%; max-width: 360px; background: #fff; border-radius: 18px; padding: 24px; box-shadow: 0 8px 28px rgba(0,0,0,.1); }
  #login h1 { font-size: 20px; margin: 0 0 4px; }
  #login p { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  #login label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
  #login input { width: 100%; padding: 12px; border: 1px solid #cfd6e2; border-radius: 10px; font-size: 16px; }
  #login .go { width: 100%; margin-top: 18px; padding: 14px; background: #1f3b73; color: #fff; font-size: 17px; font-weight: 700; }
  #loginMsg { color: var(--bad); font-size: 14px; min-height: 20px; margin-top: 10px; }

  /* 메인 */
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #161d2e; }
  header .count { font-size: 22px; font-weight: 800; }
  header .count small { font-size: 14px; opacity: .7; font-weight: 500; }
  header .staff { margin-left: auto; font-size: 13px; opacity: .8; text-align: right; }
  #pendBadge { background: var(--net); color: #fff; padding: 4px 10px; border-radius: 99px; font-size: 13px; font-weight: 700; }
  #camWrap { position: relative; flex: 1; overflow: hidden; background: #000; }
  #video { width: 100%; height: 100%; object-fit: cover; }
  #frame { position: absolute; left: 50%; top: 50%; width: 64vmin; height: 64vmin; transform: translate(-50%, -50%);
           border: 3px solid rgba(255,255,255,.9); border-radius: 18px; box-shadow: 0 0 0 9999px rgba(0,0,0,.35); pointer-events: none; }
  #camMsg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
            padding: 24px; font-size: 16px; line-height: 1.6; background: #000; }
  #status { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 15px; text-shadow: 0 1px 3px #000; }
  .bar { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: #161d2e; }
  .bar button { flex: 1; padding: 15px 6px; font-size: 16px; font-weight: 700; color: #fff; background: #2b3550; }
  .bar button.primary { background: #2f6fed; }

  /* 결과 오버레이 */
  #result { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 24px; z-index: 20; }
  #result.ok { background: var(--ok); }
  #result.dup { background: var(--dup); color: #1d1600; }
  #result.bad { background: var(--bad); }
  #result.net { background: var(--net); }
  #result.wait { background: rgba(15,20,32,.92); }
  #rIcon { font-size: 72px; line-height: 1; }
  #rTitle { font-size: 32px; font-weight: 900; margin-top: 12px; }
  #rWho { font-size: 30px; font-weight: 800; margin-top: 16px; line-height: 1.35; word-break: keep-all; }
  #rSub { font-size: 18px; margin-top: 12px; opacity: .92; line-height: 1.5; white-space: pre-line; }
  #rBtns { display: flex; gap: 10px; margin-top: 26px; width: 100%; max-width: 420px; }
  #rBtns button { flex: 1; padding: 16px 8px; font-size: 17px; font-weight: 800; background: rgba(255,255,255,.95); color: #1d2433; }
  #rTap { position: absolute; bottom: calc(18px + env(safe-area-inset-bottom)); font-size: 14px; opacity: .8; }
  #rBar { position: absolute; top: 0; left: 0; height: 6px; background: rgba(255,255,255,.75); width: 0; }

  /* 수동 검색 */
  #search { position: fixed; inset: 0; background: #eef1f6; color: var(--ink); z-index: 10; display: flex; flex-direction: column; }
  #search .top { display: flex; gap: 8px; padding: 12px; background: #fff; border-bottom: 1px solid #dde3ec; }
  #q { flex: 1; padding: 13px 12px; border: 1px solid #cfd6e2; border-radius: 10px; font-size: 17px; }
  #search .close { padding: 0 16px; background: #2b3550; color: #fff; font-weight: 700; }
  #sInfo { padding: 8px 14px; font-size: 13px; color: var(--muted); }
  #list { flex: 1; overflow-y: auto; padding: 0 12px 24px; -webkit-overflow-scrolling: touch; }
  .item { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 12px; padding: 12px 12px; margin-bottom: 8px; }
  .item .nm { font-size: 18px; font-weight: 800; }
  .item .sc { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .item .st { margin-left: auto; text-align: right; flex-shrink: 0; }
  .item button { padding: 11px 14px; background: #2f6fed; color: #fff; font-weight: 800; font-size: 15px; }
  .item button.confirm { background: var(--ok); }
  .tag { display: inline-block; font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 99px; background: #fff3c4; color: #7a5b00; }

  /* 보류 목록 */
  #pending { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 15; display: flex; align-items: flex-end; }
  #pending .sheet { background: #fff; color: var(--ink); width: 100%; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 70vh; overflow-y: auto; }
  #pending h3 { margin: 0 0 6px; }
  #pending .row { padding: 10px 0; border-bottom: 1px solid #eee; font-size: 15px; }
  #pending .acts { display: flex; gap: 8px; margin-top: 14px; }
  #pending .acts button { flex: 1; padding: 13px; font-weight: 700; background: #2b3550; color: #fff; }
  #toast { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); background: rgba(0,0,0,.85); color: #fff;
           padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 30; max-width: 90vw; text-align: center; }
  #fileInput { display: none; }
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login">
  <div class="card">
    <h1>입장 스캔 (스태프 전용)</h1>
    <p id="evName">비밀번호를 입력하세요.</p>
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password">
    <label for="staffName">스태프 이름/번호 (선택)</label>
    <input id="staffName" type="text" placeholder="예: 1번 입구 김OO" maxlength="20">
    <button class="go" id="loginBtn">스캔 시작</button>
    <div id="loginMsg"></div>
  </div>
</div>

<!-- 메인 -->
<div id="app" class="hidden">
  <header>
    <div class="count"><span id="cPresent">-</span><small> / <span id="cTotal">-</span>명 입장</small></div>
    <span id="pendBadge" class="hidden"></span>
    <div class="staff"><span id="staffLbl"></span><br><a id="logout" style="color:#9fb4ff;text-decoration:underline">로그아웃</a></div>
  </header>
  <div id="camWrap">
    <video id="video" playsinline muted autoplay></video>
    <div id="frame"></div>
    <div id="camMsg" class="hidden"></div>
    <div id="status">카메라 준비 중…</div>
  </div>
  <div class="bar">
    <button id="photoBtn">📷 사진으로 스캔</button>
    <button id="searchBtn" class="primary">🔍 이름 검색 체크</button>
  </div>
  <input id="fileInput" type="file" accept="image/*" capture="environment">
</div>

<!-- 수동 검색 -->
<div id="search" class="hidden">
  <div class="top">
    <input id="q" type="search" placeholder="이름, 학교, 학년 (예: 정발중 3 김)" autocomplete="off">
    <button class="close" id="searchClose">닫기</button>
  </div>
  <div id="sInfo"></div>
  <div id="list"></div>
</div>

<!-- 보류 목록 -->
<div id="pending" class="hidden">
  <div class="sheet">
    <h3>전송 보류 목록</h3>
    <div style="font-size:13px;color:#6b7280">인터넷이 연결되면 15초마다 자동으로 다시 보냅니다.</div>
    <div id="pendList"></div>
    <div class="acts"><button id="pendRetry">지금 다시 보내기</button><button id="pendClose">닫기</button></div>
  </div>
</div>

<!-- 결과 -->
<div id="result" class="hidden">
  <div id="rBar"></div>
  <div id="rIcon"></div>
  <div id="rTitle"></div>
  <div id="rWho"></div>
  <div id="rSub"></div>
  <div id="rBtns"></div>
  <div id="rTap">화면을 누르면 바로 다음 스캔</div>
</div>
<div id="toast" class="hidden"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var IN_GAS = typeof google !== 'undefined' && google.script && google.script.run;

  var S = {
    pw: '', staff: '', present: 0, total: 0,
    list: null,            // 수동 검색용 명단
    busy: false,           // 서버 처리 중 / 결과 표시 중
    lastCode: '', lastAt: 0,
    stream: null, liveOK: false,
    resultTimer: null,
    pending: []            // 전송 실패분
  };

  /* ---------- 저장소 (실패해도 동작) ---------- */
  function sget(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function sset(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function sdel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  /* ---------- 서버 호출 ---------- */
  function call(params, timeoutMs) {
    timeoutMs = timeoutMs || 15000;
    params.pw = S.pw;
    return new Promise(function (resolve, reject) {
      var done = false;
      var t = setTimeout(function () { if (!done) { done = true; reject(new Error('timeout')); } }, timeoutMs);
      function ok(r) { if (done) return; done = true; clearTimeout(t); resolve(r); }
      function fail(e) { if (done) return; done = true; clearTimeout(t); reject(e || new Error('fail')); }
      if (IN_GAS) {
        google.script.run.withSuccessHandler(ok).withFailureHandler(fail).api(params);
      } else {
        if (!API_URL) return fail(new Error('noapi'));
        var qs = Object.keys(params).map(function (k) {
          return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
        }).join('&');
        fetch(API_URL + '?' + qs, { method: 'GET', redirect: 'follow', cache: 'no-store' })
          .then(function (r) { return r.json(); }).then(ok, fail);
      }
    });
  }

  /* ---------- 소리/진동 ---------- */
  var actx = null;
  function unlockAudio() {
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
  }
  function beep(freqs, dur) {
    if (!actx) return;
    try {
      var t = actx.currentTime;
      freqs.forEach(function (f, i) {
        var o = actx.createOscillator(), g = actx.createGain();
        o.frequency.value = f; o.type = 'sine';
        g.gain.setValueAtTime(0.25, t + i * (dur + 0.05));
        g.gain.exponentialRampToValueAtTime(0.001, t + i * (dur + 0.05) + dur);
        o.connect(g); g.connect(actx.destination);
        o.start(t + i * (dur + 0.05)); o.stop(t + i * (dur + 0.05) + dur);
      });
    } catch (e) {}
  }
  function feedback(kind) {
    var v = { ok: [80], dup: [120, 80, 120], bad: [400], net: [200, 100, 200] }[kind] || [50];
    try { navigator.vibrate && navigator.vibrate(v); } catch (e) {}
    if (kind === 'ok') beep([1320], 0.12);
    else if (kind === 'dup') beep([660, 660], 0.15);
    else beep([220], 0.45);
  }

  /* ---------- 공통 표시 ---------- */
  function who(r) {
    return [r.school || r.s || '', (r.grade || r.g) ? (r.grade || r.g) + '학년' : '', r.name || r.n || '']
      .filter(Boolean).join(' ');
  }
  function hhmm(ts) { var m = String(ts || '').match(/(\d{1,2}:\d{2}(:\d{2})?)/); return m ? m[1] : (ts || ''); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function setStats(r) {
    if (r && typeof r.present === 'number') { S.present = r.present; S.total = r.total; }
    $('cPresent').textContent = S.present; $('cTotal').textContent = S.total;
  }
  function toast(msg, ms) {
    var t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(t._h); t._h = setTimeout(function () { t.classList.add('hidden'); }, ms || 2500);
  }
  function normCode(v) {
    var s = String(v || '').trim();
    var m = s.match(/[?&]id=([^&#\s]+)/); if (m) s = decodeURIComponent(m[1]);
    return s.toUpperCase().replace(/[^A-Z0-9]/g, '');
  }

  /* ---------- 결과 화면 ---------- */
  function showResult(kind, icon, title, whoTxt, sub, buttons, autoMs) {
    var el = $('result');
    el.className = kind;
    $('rIcon').textContent = icon; $('rTitle').textContent = title;
    $('rWho').textContent = whoTxt || ''; $('rSub').textContent = sub || '';
    var bx = $('rBtns'); bx.innerHTML = '';
    (buttons || []).forEach(function (b) {
      var btn = document.createElement('button'); btn.textContent = b.label;
      btn.onclick = function (ev) { ev.stopPropagation(); b.fn(); };
      bx.appendChild(btn);
    });
    $('rTap').style.display = (buttons && buttons.length) || kind === 'wait' ? 'none' : '';
    clearTimeout(S.resultTimer);
    var bar = $('rBar'); bar.style.transition = 'none'; bar.style.width = '0';
    if (autoMs) {
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        bar.style.transition = 'width ' + autoMs + 'ms linear'; bar.style.width = '100%';
      }); });
      S.resultTimer = setTimeout(closeResult, autoMs);
    }
  }
  function closeResult() {
    clearTimeout(S.resultTimer);
    $('result').className = 'hidden';
    S.busy = false;
    $('status').textContent = S.liveOK ? 'QR을 네모 안에 비춰 주세요' : $('status').textContent;
  }
  $('result').addEventListener('click', function () {
    if (!$('result').classList.contains('wait') && !$('rBtns').children.length) closeResult();
  });

  /* ---------- 입장 처리 ---------- */
  function process(code, method, isRetry) {
    code = normCode(code);
    if (!code) return;
    S.busy = true;
    showResult('wait', '⏳', '확인 중…', '', '', null, 0);
    call({ action: 'checkin', code: code, staff: S.staff, method: method, retry: isRetry ? 1 : 0 })
      .then(function (r) { handleCheckin(r, code, method, isRetry); })
      .catch(function () { netFail(code, method); });
  }

  function handleCheckin(r, code, method, isRetry) {
    if (!r || !r.ok) {
      if (r && r.error === 'auth') { logout('비밀번호가 바뀌었거나 틀렸습니다. 다시 로그인하세요.'); return; }
      return netFail(code, method, r && r.message);
    }
    setStats(r);
    updateLocal(r);
    if (r.result === 'ok' || (isRetry && r.result === 'dup' && r.prevStaff === S.staff)) {
      feedback('ok');
      showResult('ok', '✅', '출석 완료', who(r), hhmm(r.time) + (isRetry ? ' (재전송 확인)' : ''), null, 2200);
    } else if (r.result === 'dup') {
      feedback('dup');
      showResult('dup', '⚠️', '이미 입장함 — 입장 거부', who(r),
        '입장 시각 ' + hhmm(r.time) + (r.prevStaff ? ' · ' + r.prevStaff : ''), null, 4000);
    } else if (r.result === 'unknown') {
      feedback('bad');
      showResult('bad', '⛔', '등록되지 않은 코드', '', '코드: ' + (r.code || code) + '\n이름 검색으로 확인하세요', null, 4000);
    } else if (r.result === 'busy') {
      netFail(code, method, '서버가 바쁩니다');
    }
  }

  function netFail(code, method, msg) {
    feedback('net');
    var p = findLocal(code);
    showResult('net', '📶', '서버 연결 실패', p ? who(p) : '', (msg ? msg + ' · ' : '') + '입장 기록이 아직 저장되지 않았습니다.', [
      { label: '다시 시도', fn: function () { process(code, method, true); } },
      { label: '보류 후 다음', fn: function () { addPending(code, method); closeResult(); } }
    ], 0);
  }

  /* ---------- 보류(오프라인) 목록 ---------- */
  function savePending() { sset('scan_pending', JSON.stringify(S.pending)); renderPendBadge(); }
  function addPending(code, method) {
    if (!S.pending.some(function (x) { return x.code === code; }))
      S.pending.push({ code: code, method: method, at: new Date().toTimeString().slice(0, 8) });
    savePending();
    toast('보류 목록에 저장했습니다. 연결되면 자동 전송합니다.');
  }
  function renderPendBadge() {
    var b = $('pendBadge');
    if (S.pending.length) { b.textContent = '보류 ' + S.pending.length; b.classList.remove('hidden'); }
    else b.classList.add('hidden');
  }
  var flushing = false;
  function flushPending() {
    if (flushing || !S.pending.length || !S.pw) return Promise.resolve();
    flushing = true;
    var items = S.pending.slice();
    var chain = Promise.resolve();
    items.forEach(function (it) {
      chain = chain.then(function () {
        return call({ action: 'checkin', code: it.code, staff: S.staff, method: it.method, retry: 1 })
          .then(function (r) {
            if (!r || !r.ok || r.result === 'busy') return;
            S.pending = S.pending.filter(function (x) { return x.code !== it.code; });
            savePending(); setStats(r); updateLocal(r);
            var label = r.result === 'ok' || (r.result === 'dup' && r.prevStaff === S.staff) ? '출석 완료'
                      : r.result === 'dup' ? '이미 입장(' + hhmm(r.time) + ')' : '미등록 코드';
            toast('보류 처리: ' + (who(r) || it.code) + ' → ' + label, 4000);
          }, function () {});
      });
    });
    return chain.then(function () { flushing = false; renderPendList(); }, function () { flushing = false; });
  }
  function renderPendList() {
    $('pendList').innerHTML = S.pending.length ? S.pending.map(function (x) {
      var p = findLocal(x.code);
      return '<div class="row"><b>' + esc(p ? who(p) : x.code) + '</b><br><span style="color:#6b7280">' + esc(x.at) + ' 스캔 · ' + esc(x.method) + '</span></div>';
    }).join('') : '<div class="row">보류된 항목이 없습니다.</div>';
  }
  $('pendBadge').onclick = function () { renderPendList(); $('pending').classList.remove('hidden'); };
  $('pendClose').onclick = function () { $('pending').classList.add('hidden'); };
  $('pendRetry').onclick = function () { flushPending(); };

  /* ---------- 명단(수동 검색) ---------- */
  function loadRoster() {
    return call({ action: 'roster' }, 20000).then(function (r) {
      if (r && r.ok) { S.list = r.list; setStats(r); sset('scan_roster', JSON.stringify(r.list)); }
    }, function () {
      if (!S.list) { try { S.list = JSON.parse(sget('scan_roster') || 'null'); } catch (e) {} }
    });
  }
  function findLocal(code) {
    if (!S.list) return null;
    for (var i = 0; i < S.list.length; i++) if (S.list[i].c === code) return S.list[i];
    return null;
  }
  function updateLocal(r) {
    var p = findLocal(r.code);
    if (p && (r.result === 'ok' || r.result === 'dup')) { p.in = 1; p.t = r.time; }
  }
  function renderSearch() {
    var q = $('q').value.trim();
    var info = $('sInfo'), box = $('list');
    if (!S.list) { info.textContent = '명단을 불러오는 중… (인터넷 연결 확인)'; box.innerHTML = ''; return; }
    var toks = q.toLowerCase().split(/\s+/).filter(Boolean);
    var res = S.list.filter(function (p) {
      var hay = (p.s + ' ' + p.g + '학년 ' + p.n).toLowerCase();
      return toks.every(function (t) { return hay.indexOf(t) >= 0 || (/^\d$/.test(t) && p.g === t); });
    });
    info.textContent = q ? '검색 결과 ' + res.length + '명' + (res.length > 40 ? ' (위 40명만 표시)' : '')
                         : '이름 또는 학교를 입력하세요 · 전체 ' + S.list.length + '명';
    if (!q) { box.innerHTML = ''; return; }
    box.innerHTML = res.slice(0, 40).map(function (p) {
      var st = p.in ? '<span class="tag">입장함 ' + esc(hhmm(p.t)) + '</span>'
                    : '<button data-c="' + esc(p.c) + '">입장 처리</button>';
      return '<div class="item"><div><div class="nm">' + esc(p.n) + '</div><div class="sc">' +
             esc(p.s) + (p.g ? ' · ' + esc(p.g) + '학년' : '') + '</div></div><div class="st">' + st + '</div></div>';
    }).join('') || '<div style="padding:20px;text-align:center;color:#6b7280">일치하는 사람이 없습니다.</div>';
  }
  $('list').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-c]'); if (!b) return;
    if (!b.classList.contains('confirm')) {           // 오터치 방지: 두 번 눌러 확정
      b.classList.add('confirm'); b.textContent = '한 번 더 → 확정';
      setTimeout(function () { if (b.isConnected) { b.classList.remove('confirm'); b.textContent = '입장 처리'; } }, 3000);
      return;
    }
    process(b.getAttribute('data-c'), 'manual');
    $('search').classList.add('hidden');
  });
  $('q').addEventListener('input', renderSearch);
  $('searchBtn').onclick = function () {
    $('search').classList.remove('hidden'); $('q').value = ''; renderSearch();
    setTimeout(function () { $('q').focus(); }, 50);
    loadRoster().then(renderSearch);
  };
  $('searchClose').onclick = function () { $('search').classList.add('hidden'); };

  /* ---------- 카메라 (실시간) ---------- */
  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var lastScan = 0;

  function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return camFail('NotSupported');
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false })
      .then(function (stream) {
        S.stream = stream; S.liveOK = true;
        var v = $('video'); v.srcObject = stream; v.play().catch(function () {});
        $('camMsg').classList.add('hidden');
        $('status').textContent = 'QR을 네모 안에 비춰 주세요';
        requestAnimationFrame(tick);
      }, function (err) { camFail(err && err.name); });
  }
  function camFail(name) {
    S.liveOK = false;
    var m = $('camMsg'); m.classList.remove('hidden');
    var why = name === 'NotAllowedError'
      ? (IN_GAS ? '이 주소(Apps Script)에서는 실시간 카메라가 막혀 있습니다.' : '카메라 권한이 거부되었습니다. 브라우저 설정에서 카메라를 허용해 주세요.')
      : '실시간 카메라를 사용할 수 없습니다.';
    m.innerHTML = '<div>' + esc(why) + '<br><br>아래 <b>📷 사진으로 스캔</b> 버튼으로 QR을 찍거나<br><b>🔍 이름 검색</b>으로 체크하세요.' +
      (IN_GAS ? '<br><br><span style="opacity:.7;font-size:14px">연속 스캔을 원하면 안내서의 “GitHub Pages 스캔 페이지”를 사용하세요.</span>' : '') +
      '<br><br><button id="camRetry" style="padding:10px 16px;background:#2b3550;color:#fff">카메라 다시 시도</button></div>';
    $('camRetry').onclick = startCamera;
    $('status').textContent = '';
    $('photoBtn').classList.add('primary');
  }
  function tick(now) {
    if (!S.stream) return;
    requestAnimationFrame(tick);
    if (S.busy || !$('search').classList.contains('hidden') || now - lastScan < 120) return;
    var v = $('video');
    if (v.readyState < 2 || !v.videoWidth) return;
    lastScan = now;
    // 화면 가운데 정사각형 영역만 잘라서 해석 (빠름)
    var side = Math.min(v.videoWidth, v.videoHeight) * 0.8;
    var sx = (v.videoWidth - side) / 2, sy = (v.videoHeight - side) / 2;
    var size = 480;
    canvas.width = size; canvas.height = size;
    ctx.drawImage(v, sx, sy, side, side, 0, 0, size, size);
    var img = ctx.getImageData(0, 0, size, size);
    var qr = window.jsQR && jsQR(img.data, size, size, { inversionAttempts: 'dontInvert' });
    if (qr && qr.data) {
      var code = normCode(qr.data);
      var t = Date.now();
      if (code === S.lastCode && t - S.lastAt < 10000) return;  // 같은 QR을 계속 비추는 경우 10초간 무시
      S.lastCode = code; S.lastAt = t;
      process(code, 'qr');
    }
  }

  /* ---------- 사진으로 스캔 (카메라 막힌 환경용) ---------- */
  $('photoBtn').onclick = function () { $('fileInput').value = ''; $('fileInput').click(); };
  $('fileInput').addEventListener('change', function () {
    var f = this.files && this.files[0]; if (!f) return;
    var url = URL.createObjectURL(f);
    var im = new Image();
    im.onload = function () {
      var max = 1400, w = im.naturalWidth, h = im.naturalHeight, k = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      var x = c.getContext('2d'); x.drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      var d = x.getImageData(0, 0, c.width, c.height);
      var qr = window.jsQR && jsQR(d.data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
      if (qr && qr.data) process(qr.data, 'photo');
      else { feedback('bad'); showResult('bad', '🔍', 'QR을 찾지 못했습니다', '', '조금 더 가까이, 흔들리지 않게 다시 찍거나\n이름 검색으로 체크하세요.', null, 3000); }
    };
    im.onerror = function () { toast('사진을 읽지 못했습니다.'); };
    im.src = url;
  });

  /* ---------- 로그인 ---------- */
  function login(pw, staff, silent) {
    S.pw = pw; S.staff = staff;
    $('loginMsg').textContent = silent ? '' : '확인 중…';
    if (!IN_GAS && !API_URL) { $('loginMsg').textContent = '설정 오류: scan.html의 API_URL이 비어 있습니다.'; return; }
    call({ action: 'login' }, 20000).then(function (r) {
      if (!r || !r.ok) {
        $('loginMsg').textContent = r && r.error === 'auth' ? '비밀번호가 틀렸습니다.' : '서버 오류: ' + ((r && r.message) || '');
        $('login').classList.remove('hidden'); return;
      }
      sset('scan_pw', pw); sset('scan_staff', staff);
      setStats(r);
      document.title = '입장 스캔 · ' + (r.eventName || '');
      $('staffLbl').textContent = staff;
      $('login').classList.add('hidden'); $('app').classList.remove('hidden');
      if (!S.stream) startCamera();
      loadRoster();
      flushPending();
      try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {}
    }, function () {
      $('loginMsg').textContent = '서버에 연결할 수 없습니다. 인터넷을 확인하고 다시 눌러 주세요.';
      $('login').classList.remove('hidden');
    });
  }
  function logout(msg) {
    sdel('scan_pw'); S.pw = '';
    if (S.stream) { S.stream.getTracks().forEach(function (t) { t.stop(); }); S.stream = null; }
    closeResult();
    $('app').classList.add('hidden'); $('login').classList.remove('hidden');
    $('loginMsg').textContent = msg || '';
  }
  $('logout').onclick = function () { logout(); };
  $('loginBtn').onclick = function () {
    unlockAudio();
    var name = $('staffName').value.trim() || ('스태프-' + Math.random().toString(36).slice(2, 6).toUpperCase());
    login($('pw').value, name);
  };
  $('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('loginBtn').click(); });

  // 시작
  try { S.pending = JSON.parse(sget('scan_pending') || '[]'); } catch (e) { S.pending = []; }
  renderPendBadge();
  $('staffName').value = sget('scan_staff') || '';
  if (sget('scan_pw')) {
    $('pw').value = sget('scan_pw');
    $('loginMsg').textContent = '저장된 비밀번호가 있습니다. [스캔 시작]을 눌러 주세요.';
  }
  // 다른 스태프 폰의 입장 현황 반영 + 보류분 재전송
  setInterval(function () {
    if (!S.pw || $('app').classList.contains('hidden')) return;
    call({ action: 'stats' }, 10000).then(function (r) { if (r && r.ok) setStats(r); }, function () {});
    flushPending();
  }, 15000);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && S.pw && S.liveOK && !S.stream) startCamera();
  });
})();
</script>
</body>
</html>
